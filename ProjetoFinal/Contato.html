
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contato | StoreProject</title>

    <link rel="stylesheet" href="Project.css">
    <script src="Project.js"></script>
</head>

<body>

    <header>
        <nav class="navbar container">

            <a href="Project.html" class="logo">
                Store<span>Project</span>
            </a>

            <div class="nav-links">
                <a href="Project.html">Início</a>
                <a href="produtos.html">Produtos</a>
                <a href="sobre.html">Sobre</a>
                <a href="contato.html">Contato</a>
            </div>

        </nav>
    </header>


    <main class="container products-section">

        <div class="section-header">
            <div>
                <span class="tag">FALE CONOSCO</span>
                <h2>Entre em contato</h2>
            </div>
        </div>


        <form id="contact-form" class="contact-form">

            <label for="name">Nome completo</label>
            <input
                type="text"
                id="name"
                placeholder="Digite seu nome"
                required
            >

            <label for="email">E-mail</label>
            <input
                type="email"
                id="email"
                placeholder="Digite seu e-mail"
                required
            >

            <label for="message">Mensagem</label>
            <textarea
                id="message"
                rows="6"
                placeholder="Escreva sua mensagem..."
                required
            ></textarea>

            <button type="submit" class="add-button">
                Enviar mensagem
            </button>

            <p id="form-feedback" aria-live="polite"></p>

        </form>

    </main>


    <footer>
        <div class="container footer-content">
            <p>© 2026 StoreProject. Todos os direitos reservados.</p>
        </div>
    </footer>

</body>
</html>
